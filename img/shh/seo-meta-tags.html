<!--
  ══════════════════════════════════════════════════════════════════
  ARCHIVO: seo-meta-tags.html
  Instrucción: Reemplaza o completa el bloque <head> de index.html
  con estas etiquetas. Las que ya existen (charset, viewport, title)
  pueden actualizarse con las versiones mejoradas que están aquí.
  ══════════════════════════════════════════════════════════════════
-->

<!-- ── Básicos ── -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- ── Title & Description ── -->
<title>AquaIngenieros Perú – Equipos para Tratamiento de Aguas Industriales</title>
<meta name="description" content="Venta de equipos para tratamiento de aguas en Perú: ósmosis inversa, ablandadores, filtros multimedia, carbón activado, desinfección UV y bombas dosificadoras. Marcas Pentair, Suez, Canature, Viqua, SEKO. Envíos nacionales. Llama: +51 985 300 777.">
<meta name="keywords" content="tratamiento de aguas Peru, osmosis inversa Peru, ablandador de agua Peru, filtro multimedia, filtro carbon activado, membrana RO, desinfeccion UV, bomba dosificadora, Pentair Peru, Canature Peru, equipo tratamiento agua industrial">
<meta name="author" content="AquaIngenieros Perú">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="language" content="Spanish">
<link rel="canonical" href="https://aquaingenieros.com/">

<!-- ── Open Graph (Facebook / LinkedIn / WhatsApp) ── -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="AquaIngenieros Perú">
<meta property="og:title" content="AquaIngenieros Perú – Equipos para Tratamiento de Aguas Industriales">
<meta property="og:description" content="Catálogo completo de equipos para tratamiento de aguas en Perú. Ósmosis inversa, ablandadores, filtros, UV, bombas dosificadoras. Pentair, Suez, Canature, Viqua, SEKO. Envíos a todo el Perú.">
<meta property="og:url" content="https://aquaingenieros.com/">
<meta property="og:image" content="https://aquaingenieros.com/img/logo_aqua_ingenieros.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_PE">

<!-- ── Twitter Card ── -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AquaIngenieros Perú – Equipos para Tratamiento de Aguas Industriales">
<meta name="twitter:description" content="Catálogo de equipos para tratamiento de aguas en Perú: ósmosis inversa, ablandadores, filtros, UV y bombas dosificadoras. Envíos nacionales.">
<meta name="twitter:image" content="https://aquaingenieros.com/img/logo_aqua_ingenieros.png">

<!-- ── Geolocalización ── -->
<meta name="geo.region" content="PE">
<meta name="geo.country" content="Peru">
<meta name="ICBM" content="-9.189967, -75.015152">

<!-- ── Favicon (ajusta la ruta si tienes uno) ── -->
<link rel="icon" type="image/png" href="/img/logo_aqua_ingenieros.png">
<link rel="apple-touch-icon" href="/img/logo_aqua_ingenieros.png">
